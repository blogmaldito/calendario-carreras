.cal-header{padding:1.5rem 0 1rem}
.cal-title{font-size:22px;font-weight:600;color:#111;margin-bottom:4px}
.cal-sub{font-size:14px;color:#777;line-height:1.6}
.stats-bar{display:flex;gap:16px;margin-bottom:1rem;flex-wrap:wrap}
.stat{font-size:13px;color:#666}
.stat strong{color:#111;font-weight:600}
.filters-wrap{margin-bottom:1rem}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;align-items:center}
.filter-label{font-size:10px;font-weight:700;color:#bbb;text-transform:uppercase;letter-spacing:.08em;min-width:70px}
.fbtn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:14px;border:1px solid #e0e0e0;background:#fff;color:#666;cursor:pointer;transition:all .12s;white-space:nowrap}
.fbtn:hover:not(.active){background:#f5f5f5}
.fbtn.active{background:#111;color:#fff;border-color:#111}
.search-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-input{width:100%;font-size:12px;padding:6px 10px 6px 28px;border:1px solid #ddd;border-radius:20px;outline:none;color:#333}
.search-input:focus{border-color:#888}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#bbb;font-size:12px;pointer-events:none}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#bbb;cursor:pointer;font-size:13px;display:none}
.month-block{margin-bottom:2rem}
.month-label{font-size:12px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.08em;padding:8px 0;border-bottom:1px solid #eee;margin-bottom:.75rem}
.race-item{border:1px solid #eee;border-radius:8px;margin-bottom:5px;overflow:hidden}
.race-header{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
.race-header:hover{background:#fafafa}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.dot-ok{background:#2e7d32}
.dot-pend{background:#e65100}
.race-content{flex:1;min-width:0}
.race-name{font-size:13px;font-weight:500;color:#111;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.race-loc{font-size:11px;color:#888}
.race-prov{font-size:10px;color:#bbb;background:#f5f5f5;padding:1px 6px;border-radius:8px}
.race-date{font-size:11px;color:#888}
.race-dist{font-size:11px;padding:1px 7px;border-radius:10px;background:#f0f0f0;color:#555}
.chevron{width:14px;height:14px;color:#ccc;transition:transform .2s;flex-shrink:0;margin-top:3px}
.chevron.open{transform:rotate(180deg)}
.race-body{padding:0 14px 10px 32px;display:none;grid-template-columns:1fr 1fr 1fr;gap:5px}
.race-body.open{display:grid}
.detail{font-size:11px;color:#666}
.detail span{color:#bbb;margin-right:3px}
.links{grid-column:1/-1;margin-top:5px}
.link-web{font-size:11px;font-weight:500;color:#1565c0;text-decoration:none;border-bottom:1px solid #bbdefb}
.legend{display:flex;gap:16px;margin-bottom:1rem}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#666}
.legend-dot{width:8px;height:8px;border-radius:50%}
.empty{text-align:center;padding:3rem;color:#bbb;font-size:14px}
</style>

var MONTH_ORDER = ['Septiembre 2026','Octubre 2026','Noviembre 2026','Diciembre 2026',
  'Enero 2027','Febrero 2027','Marzo 2027','Abril 2027','Mayo 2027',
  'Junio 2027','Julio 2027','Agosto 2027','Septiembre 2027','Octubre 2027','Noviembre 2027'];

var SHORT = {'Septiembre':'Sep','Octubre':'Oct','Noviembre':'Nov','Diciembre':'Dic',
  'Enero':'Ene','Febrero':'Feb','Marzo':'Mar','Abril':'Abr','Mayo':'May',
  'Junio':'Jun','Julio':'Jul','Agosto':'Ago'};

var filters = {month: 'Todos', loc: '', prov: '', com: ''};

function getFiltered() {
  return RACES.filter(function(r) {
    if (filters.month !== 'Todos' && r.month !== filters.month) return false;
    if (filters.loc && r.loc.toLowerCase().indexOf(filters.loc) < 0) return false;
    if (filters.prov && r.prov.toLowerCase().indexOf(filters.prov) < 0) return false;
    if (filters.com && r.com.toLowerCase().indexOf(filters.com) < 0) return false;
    return true;
  });
}

function render() {
  var fr = getFiltered();
  document.getElementById('s-total').innerHTML = '<strong>' + fr.length + '</strong> carreras';
  document.getElementById('s-conf').innerHTML = '<strong style="color:#2e7d32">' + fr.filter(function(r){return r.confirmed;}).length + '</strong> confirmadas';

  var byMonth = {};
  fr.forEach(function(r) {
    if (!byMonth[r.month]) byMonth[r.month] = [];
    byMonth[r.month].push(r);
  });

  var listEl = document.getElementById('list');
  listEl.innerHTML = '';

  var months = MONTH_ORDER.filter(function(m) { return byMonth[m]; });
  if (!months.length) {
    listEl.innerHTML = '<div class="empty">No hay carreras con estos filtros</div>';
    return;
  }

  months.forEach(function(m) {
    var rs = byMonth[m];
    var block = document.createElement('div');
    block.className = 'month-block';
    var lbl = document.createElement('div');
    lbl.className = 'month-label';
    lbl.textContent = m + ' · ' + rs.length + ' carrera' + (rs.length !== 1 ? 's' : '');
    block.appendChild(lbl);

    rs.forEach(function(r, i) {
      var item = document.createElement('div');
      item.className = 'race-item';

      var hdr = document.createElement('div');
      hdr.className = 'race-header';

      var dot = document.createElement('div');
      dot.className = 'dot ' + (r.confirmed ? 'dot-ok' : 'dot-pend');
      hdr.appendChild(dot);

      var cnt = document.createElement('div');
      cnt.className = 'race-content';
      var nm = document.createElement('div');
      nm.className = 'race-name';
      nm.textContent = r.name;
      cnt.appendChild(nm);
      var mt = document.createElement('div');
      mt.className = 'race-meta';
      var loc = document.createElement('span'); loc.className = 'race-loc'; loc.textContent = r.loc;
      var prov = document.createElement('span'); prov.className = 'race-prov'; prov.textContent = r.prov;
      var dt = document.createElement('span'); dt.className = 'race-date'; dt.textContent = r.date;
      var dist = document.createElement('span'); dist.className = 'race-dist'; dist.textContent = r.dist;
      mt.appendChild(loc); mt.appendChild(prov); mt.appendChild(dt); mt.appendChild(dist);
      cnt.appendChild(mt);
      hdr.appendChild(cnt);

      var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','chevron'); svg.setAttribute('viewBox','0 0 16 16');
      svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor'); svg.setAttribute('stroke-width','1.5');
      var path = document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('d','M4 6l4 4 4-4'); svg.appendChild(path);
      hdr.appendChild(svg);

      var body = document.createElement('div');
      body.className = 'race-body';
      var d1 = document.createElement('div'); d1.className = 'detail';
      d1.innerHTML = '<span>Comunidad</span>' + r.com;
      var d2 = document.createElement('div'); d2.className = 'detail';
      d2.innerHTML = '<span>Provincia</span>' + r.prov;
      var d3 = document.createElement('div'); d3.className = 'detail';
      d3.innerHTML = '<span>Homologada</span>' + (r.certified ? 'Sí' : 'No');
      body.appendChild(d1); body.appendChild(d2); body.appendChild(d3);
      if (r.web) {
        var links = document.createElement('div'); links.className = 'links';
        var a = document.createElement('a'); a.className = 'link-web';
        a.href = r.web; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Web oficial';
        links.appendChild(a); body.appendChild(links);
      }

      hdr.addEventListener('click', function() {
        var open = body.style.display === 'grid';
        body.style.display = open ? 'none' : 'grid';
        svg.classList.toggle('open', !open);
      });

      item.appendChild(hdr); item.appendChild(body);
      block.appendChild(item);
    });
    listEl.appendChild(block);
  });
}

function buildMonthFilters() {
  var el = document.getElementById('month-filters');
  var months = ['Todos'].concat(MONTH_ORDER.filter(function(m) {
    return RACES.some(function(r) { return r.month === m; });
  }));
  months.forEach(function(m) {
    var btn = document.createElement('button');
    btn.className = 'fbtn' + (m === filters.month ? ' active' : '');
    if (m === 'Todos') {
      btn.textContent = 'Todos';
    } else {
      var parts = m.split(' ');
      btn.textContent = (SHORT[parts[0]] || parts[0]) + ' ' + parts[1];
    }
    btn.addEventListener('click', function() {
      filters.month = m;
      document.querySelectorAll('#month-filters .fbtn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      render();
    });
    el.appendChild(btn);
  });
}

function setupSearch(id, key, clearId) {
  var inp = document.getElementById(id);
  var clr = document.getElementById(clearId);
  inp.addEventListener('input', function() {
    filters[key] = inp.value.toLowerCase().trim();
    clr.style.display = filters[key] ? 'block' : 'none';
    render();
  });
}

function clearSearch(key) {
  var ids = {loc: ['s-loc','cl-loc'], prov: ['s-prov','cl-prov'], com: ['s-com','cl-com']};
  document.getElementById(ids[key][0]).value = '';
  document.getElementById(ids[key][1]).style.display = 'none';
  filters[key] = '';
  render();
}

setupSearch('s-loc', 'loc', 'cl-loc');
setupSearch('s-prov', 'prov', 'cl-prov');
setupSearch('s-com', 'com', 'cl-com');
buildMonthFilters();
render();
</script>
