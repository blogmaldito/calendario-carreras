<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa Carreras Cataluña 2026</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f8;height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid #e0e0e0;padding:10px 14px;flex-shrink:0}
.topbar-row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.map-title{font-size:15px;font-weight:600;color:#111;margin-right:2px}
.toggle-group{display:flex;border:1px solid #ddd;border-radius:20px;overflow:hidden}
.toggle-btn{font-size:11px;font-weight:600;padding:4px 12px;background:#fff;color:#777;border:none;cursor:pointer;transition:all .15s;white-space:nowrap}
.toggle-btn.active{background:#222;color:#fff}
.map-stats{font-size:11px;color:#aaa;margin-left:auto}
.map-stats strong{color:#555}
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.slider-label{font-size:11px;color:#888;white-space:nowrap;min-width:100px}
.slider-wrap{flex:1;min-width:150px;position:relative;height:20px}
.slider-track{position:absolute;top:8px;left:0;right:0;height:4px;background:#e0e0e0;border-radius:2px}
.slider-fill{position:absolute;top:8px;height:4px;background:#444;border-radius:2px}
input[type=range]{position:absolute;width:100%;height:4px;top:8px;left:0;appearance:none;background:transparent;pointer-events:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:#222;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:all;cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#222;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:all;cursor:pointer}
/* Search */
.search-wrap{position:relative;flex:1;max-width:220px}
.search-input{width:100%;font-size:12px;padding:5px 10px 5px 28px;border:1px solid #ddd;border-radius:20px;outline:none;color:#333;background:#fff}
.search-input:focus{border-color:#888}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#aaa;font-size:13px;pointer-events:none}
.search-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:2000;max-height:200px;overflow-y:auto;display:none}
.search-dropdown.visible{display:block}
.search-item{padding:7px 12px;font-size:12px;cursor:pointer;color:#333;display:flex;justify-content:space-between;align-items:center}
.search-item:hover{background:#f5f5f5}
.search-item span{font-size:10px;color:#aaa}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#aaa;cursor:pointer;font-size:14px;display:none}
#map{flex:1;position:relative}
/* Edit panel - hidden by default, only shown with secret key */
.edit-panel{position:absolute;top:10px;right:10px;z-index:1000;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:14px;width:260px;display:none;font-size:12px}
.edit-panel.visible{display:block}
.edit-panel h4{font-size:13px;font-weight:600;color:#111;margin-bottom:8px}
.edit-panel p{color:#777;margin-bottom:10px;line-height:1.5;font-size:11px}
.edit-coords{background:#f5f5f5;border-radius:6px;padding:8px;font-family:monospace;font-size:10px;color:#333;margin-bottom:8px;word-break:break-all;min-height:36px}
.btn-edit{width:100%;padding:7px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;margin-top:4px}
.btn-dark{background:#222;color:#fff}
.btn-green{background:#2e5e3e;color:#fff}
.btn-dark:hover{background:#444}
.btn-green:hover{background:#3d7a51}
.legend{position:absolute;bottom:24px;left:10px;z-index:1000;background:rgba(255,255,255,.95);padding:8px 12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:11px}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:3px;color:#555}
.legend-item:last-child{margin-bottom:0}
.legend-dot{width:9px;height:9px;border-radius:50%}
.popup-title{font-size:13px;font-weight:600;color:#111;margin-bottom:3px}
.popup-sub{font-size:11px;color:#888;margin-bottom:7px}
.popup-race{font-size:11px;padding:3px 0;border-bottom:1px solid #f0f0f0;display:flex;gap:5px;align-items:baseline}
.popup-race:last-child{border-bottom:none}
.popup-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:2px}
.popup-rname{flex:1;color:#333;font-weight:500}
.popup-date{color:#aaa;font-size:10px;white-space:nowrap}
.popup-dist{font-size:10px;padding:1px 5px;border-radius:6px;background:#f0f0f0;color:#666;white-space:nowrap}
.popup-link{display:block;font-size:11px;color:#1565c0;margin-top:5px;text-decoration:none}
.popup-link:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row1">
    <span class="map-title" id="map-title" onclick="titleClickEdit()" style="cursor:default" title="">Carreras Cataluña 2026</span>
    <div class="toggle-group">
      <button class="toggle-btn active" id="btn-loc" onclick="setMode('locality')">Por localidad</button>
      <button class="toggle-btn" id="btn-race" onclick="setMode('race')">Por carrera</button>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-input" type="text" placeholder="Buscar localidad..."
        oninput="onSearchInput()" onfocus="onSearchFocus()" onblur="onSearchBlur()">
      <span class="search-clear" id="search-clear" onclick="clearSearch()">✕</span>
      <div class="search-dropdown" id="search-dropdown"></div>
    </div>
    <span class="map-stats" id="stats"></span>
  </div>
  <div class="slider-row">
    <span class="slider-label" id="slider-label">Busca por fecha</span>
    <div class="slider-wrap">
      <div class="slider-track"></div>
      <div class="slider-fill" id="slider-fill"></div>
      <input type="range" id="slider-min" min="1" max="366" value="1">
      <input type="range" id="slider-max" min="1" max="366" value="366">
    </div>
  </div>
</div>

<div id="map">
  <!-- Edit panel: only accessible via secret key combo -->
  <div class="edit-panel" id="edit-panel">
    <h4>✎ Editor de coordenadas</h4>
    <p>Arrastra los pines para reposicionarlos. Los cambios se guardan en este navegador.</p>
    <div class="edit-coords" id="edit-coords">Selecciona un pin para ver sus coordenadas</div>
    <button class="btn-edit btn-dark" onclick="copyCoords()">Copiar pin seleccionado</button>
    <button class="btn-edit btn-green" onclick="exportCoords()">Exportar todos los cambios</button>
    <button class="btn-edit" style="background:#eee;color:#666;margin-top:8px" onclick="closeEdit()">Cerrar editor</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4a7c59"></div>Confirmada</div>
    <div class="legend-item"><div class="legend-dot" style="background:#c47c3e"></div>Pendiente</div>
  </div>
</div>

// Saved coords from localStorage (only used by editor)
const savedCoords = JSON.parse(localStorage.getItem('map_coords_v1') || '{}');
function getCoord(loc) {
  return savedCoords[loc] || BASE_COORDS[loc] || null;
}

// Unique localities for search
const allLocs = [...new Set(RACES.map(r=>r.loc))].sort();

// Date helpers
const MONTH_LABELS = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function doyToLabel(doy) {
  if(doy >= 366) return '31 Dic';
  if(doy <= 1) return '1 Ene';
  const months = [0,31,28,31,30,31,30,31,31,30,31,30,31];
  let m=1, d=doy;
  while(m<=12 && d>months[m]){d-=months[m];m++;}
  if(m>12) return '31 Dic';
  return `${d} ${MONTH_LABELS[m]}`;
}

// Map setup
const map = L.map('map').setView([41.7, 1.8], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);
setTimeout(()=>{
  document.querySelectorAll('.leaflet-tile-pane').forEach(el=>{
    el.style.filter='grayscale(100%) brightness(1.05)';
  });
},300);

let mode = 'locality';
let editMode = false;
let sliderMin = 1, sliderMax = 366;
let searchFilter = null;
let markersLayer = L.layerGroup().addTo(map);

// SECRET EDITOR: triple-click on title to toggle
let titleClicks = 0, titleTimer = null;
function titleClickEdit() {
  titleClicks++;
  if(titleTimer) clearTimeout(titleTimer);
  titleTimer = setTimeout(() => { titleClicks = 0; }, 600);
  if(titleClicks >= 3) {
    titleClicks = 0;
    editMode = !editMode;
    document.getElementById('edit-panel').classList.toggle('visible', editMode);
    renderMarkers();
  }
}

// Slider
const sMin = document.getElementById('slider-min');
const sMax = document.getElementById('slider-max');
const sFill = document.getElementById('slider-fill');

function updateSliderFill() {
  const pct1 = (sliderMin-1)/365*100;
  const pct2 = (sliderMax-1)/365*100;
  sFill.style.left = pct1+'%';
  sFill.style.width = (pct2-pct1)+'%';
  const label = document.getElementById('slider-label');
  label.textContent = (sliderMin===1 && sliderMax===366)
    ? 'Busca por fecha'
    : doyToLabel(sliderMin) + ' → ' + doyToLabel(sliderMax);
  renderMarkers();
}
sMin.addEventListener('input', () => { sliderMin=Math.min(parseInt(sMin.value),sliderMax-1); sMin.value=sliderMin; updateSliderFill(); });
sMax.addEventListener('input', () => { sliderMax=Math.max(parseInt(sMax.value),sliderMin+1); sMax.value=sliderMax; updateSliderFill(); });
updateSliderFill();

// Search
function onSearchInput() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  document.getElementById('search-clear').style.display = q ? 'block' : 'none';
  if(!q) { searchFilter=null; hideDropdown(); renderMarkers(); return; }
  const matches = allLocs.filter(l => l.toLowerCase().includes(q));
  showDropdown(matches, q);
}
function onSearchFocus() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  if(!q) showDropdown(allLocs.slice(0,12), '');
}
function onSearchBlur() { setTimeout(hideDropdown, 200); }
function showDropdown(locs, q) {
  const dd = document.getElementById('search-dropdown');
  if(!locs.length){dd.innerHTML='<div class="search-item" style="color:#aaa">Sin resultados</div>';dd.classList.add('visible');return;}
  dd.innerHTML = locs.slice(0,15).map(l => {
    const count = RACES.filter(r=>r.loc===l).length;
    return `<div class="search-item" onmousedown="selectLoc('${l.replace(/'/,"\\'")}')">
      <span>${l}</span><span>${count} carrera${count>1?'s':''}</span>
    </div>`;
  }).join('');
  dd.classList.add('visible');
}
function hideDropdown() { document.getElementById('search-dropdown').classList.remove('visible'); }
function selectLoc(loc) {
  searchFilter = loc;
  document.getElementById('search-input').value = loc;
  document.getElementById('search-clear').style.display = 'block';
  hideDropdown();
  renderMarkers();
  // Pan to location
  const c = getCoord(loc);
  if(c) map.setView(c, 13);
}
function clearSearch() {
  searchFilter = null;
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  renderMarkers();
}

// Filter
function filteredRaces() {
  return RACES.filter(r => {
    const dateOk = r.doy >= sliderMin && r.doy <= sliderMax;
    const locOk = !searchFilter || r.loc === searchFilter;
    return dateOk && locOk;
  });
}

// Icons
function makeIcon(confirmed, count) {
  const bg = confirmed ? '#4a7c59' : '#c47c3e';
  const s = count > 9 ? 34 : count > 4 ? 30 : count > 1 ? 26 : 22;
  const badge = count > 1
    ? `<div style="position:absolute;top:-7px;right:-7px;background:#111;color:#fff;font-size:9px;font-weight:700;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center">${count}</div>`
    : '';
  return L.divIcon({
    html: `<div style="position:relative;width:${s}px;height:${s}px;background:${bg};border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)">${badge}</div>`,
    iconSize:[s,s], iconAnchor:[s/2,s/2], className:''
  });
}

function makePopupLoc(loc, rs) {
  const rows = rs.map(r =>
    `<div class="popup-race">
      <div class="popup-dot" style="background:${r.confirmed?'#4a7c59':'#c47c3e'}"></div>
      <span class="popup-rname">${r.name}</span>
      <span class="popup-date">${r.date}</span>
      <span class="popup-dist">${r.dist}</span>
    </div>`).join('');
  const links = rs.filter(r=>r.web).map(r=>
    `<a class="popup-link" href="${r.web}" target="_blank">↗ ${r.name}</a>`).join('');
  return `<div style="min-width:210px;max-width:270px">
    <div class="popup-title">${loc}</div>
    <div class="popup-sub">${rs.length} carrera${rs.length>1?'s':''}</div>
    ${rows}${links}
  </div>`;
}

function renderMarkers() {
  markersLayer.clearLayers();
  const fr = filteredRaces();
  if(mode === 'locality') {
    const byLoc = {};
    fr.forEach(r => { if(!byLoc[r.loc])byLoc[r.loc]=[]; byLoc[r.loc].push(r); });
    let shown = 0;
    Object.entries(byLoc).forEach(([loc, rs]) => {
      const c = getCoord(loc);
      if(!c) return;
      const allConf = rs.every(r=>r.confirmed);
      const marker = L.marker(c, {icon:makeIcon(allConf,rs.length), draggable:editMode});
      marker.bindPopup(makePopupLoc(loc,rs),{maxWidth:290});
      if(editMode) {
        marker.on('click', ()=>showEditCoords(loc, marker.getLatLng()));
        marker.on('dragend', ()=>{
          const p=marker.getLatLng();
          savedCoords[loc]=[+p.lat.toFixed(5),+p.lng.toFixed(5)];
          localStorage.setItem('map_coords_v1',JSON.stringify(savedCoords));
          showEditCoords(loc,[p.lat,p.lng]);
        });
      }
      markersLayer.addLayer(marker);
      shown++;
    });
    document.getElementById('stats').innerHTML=`<strong>${shown}</strong> localidades · <strong>${fr.length}</strong> carreras`;
  } else {
    const jitter=()=>(Math.random()-0.5)*0.006;
    fr.forEach(r=>{
      const c=getCoord(r.loc);
      if(!c)return;
      const marker=L.marker([c[0]+jitter(),c[1]+jitter()],{icon:makeIcon(r.confirmed,1),draggable:editMode});
      marker.bindPopup(`<div style="min-width:190px">
        <div class="popup-title">${r.name}</div>
        <div class="popup-sub">${r.loc} · ${r.date} · ${r.month}</div>
        <div style="margin-top:5px;font-size:11px;color:#777">${r.dist}</div>
        ${r.web?`<a class="popup-link" href="${r.web}" target="_blank">↗ Web oficial</a>`:''}
      </div>`,{maxWidth:280});
      markersLayer.addLayer(marker);
    });
    document.getElementById('stats').innerHTML=`<strong>${fr.length}</strong> carreras`;
  }
}

function showEditCoords(loc, latlng) {
  document.getElementById('edit-coords').textContent=`"${loc}": [${+latlng.lat.toFixed(5)}, ${+latlng.lng.toFixed(5)}]`;
}

function copyCoords() {
  const text=document.getElementById('edit-coords').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelectorAll('.btn-edit')[0];
    btn.textContent='✓ Copiado'; setTimeout(()=>btn.textContent='Copiar pin seleccionado',2000);
  });
}

function exportCoords() {
  const saved=JSON.parse(localStorage.getItem('map_coords_v1')||'{}');
  if(!Object.keys(saved).length){alert('No hay cambios todavía.');return;}
  let text='COORDENADAS MODIFICADAS:\n(Pega esto en el chat con Claude)\n\n';
  Object.entries(saved).forEach(([loc,c])=>{ text+=`"${loc}": [${c[0]}, ${c[1]}]\n`; });
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.querySelectorAll('.btn-edit')[1];
    btn.textContent='✓ Copiado — pégalo en el chat'; setTimeout(()=>btn.textContent='Exportar todos los cambios',3000);
  });
}

function closeEdit() {
  editMode=false;
  document.getElementById('edit-panel').classList.remove('visible');
  renderMarkers();
}

function setMode(m) {
  mode=m;
  document.getElementById('btn-loc').classList.toggle('active',m==='locality');
  document.getElementById('btn-race').classList.toggle('active',m==='race');
  renderMarkers();
}

renderMarkers();
</script>
