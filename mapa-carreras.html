<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f8;height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid #e0e0e0;padding:10px 14px;flex-shrink:0}
.topbar-row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.map-title{font-size:15px;font-weight:600;color:#111;margin-right:2px;cursor:default}
.search-wrap{position:relative;flex:1;max-width:220px}
.search-input{width:100%;font-size:12px;padding:5px 10px 5px 28px;border:1px solid #ddd;border-radius:20px;outline:none;color:#333;background:#fff}
.search-input:focus{border-color:#888}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#aaa;font-size:13px;pointer-events:none}
.search-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:2000;max-height:200px;overflow-y:auto;display:none}
.search-dropdown.visible{display:block}
.search-item{padding:7px 12px;font-size:12px;cursor:pointer;color:#333;display:flex;justify-content:space-between;align-items:center}
.search-item:hover{background:#f5f5f5}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#aaa;cursor:pointer;font-size:14px;display:none}
.map-stats{font-size:11px;color:#aaa;margin-left:auto}
.map-stats strong{color:#555}
.slider-row{display:flex;align-items:center;gap:10px}
.slider-label{font-size:11px;color:#888;white-space:nowrap;min-width:100px}
.slider-wrap{flex:1;min-width:150px;position:relative;height:20px}
.slider-track{position:absolute;top:8px;left:0;right:0;height:4px;background:#e0e0e0;border-radius:2px}
.slider-fill{position:absolute;top:8px;height:4px;background:#444;border-radius:2px}
input[type=range]{position:absolute;width:100%;height:4px;top:8px;left:0;appearance:none;background:transparent;pointer-events:none}
input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:#222;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:all;cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#222;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);pointer-events:all;cursor:pointer}
#map{flex:1;position:relative}
.edit-panel{position:absolute;top:10px;right:10px;z-index:1000;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:14px;width:260px;display:none;font-size:12px}
.edit-panel.visible{display:block}
.edit-panel h4{font-size:13px;font-weight:600;color:#111;margin-bottom:8px}
.edit-panel p{color:#777;margin-bottom:10px;line-height:1.6;font-size:11px}
.edit-coords{background:#f5f5f5;border-radius:6px;padding:8px;font-family:monospace;font-size:10px;color:#333;margin-bottom:8px;word-break:break-all;min-height:40px;white-space:pre-wrap}
.btn-e{width:100%;padding:7px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;margin-top:5px}
.btn-dark{background:#222;color:#fff}
.btn-green{background:#2e5e3e;color:#fff}
.btn-grey{background:#eee;color:#666}
textarea.export-area{display:none;width:100%;margin-top:8px;font-size:10px;font-family:monospace;padding:6px;border:1px solid #ddd;border-radius:6px;height:110px;resize:vertical;color:#333}
.legend{position:absolute;bottom:24px;left:10px;z-index:1000;background:rgba(255,255,255,.95);padding:8px 12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:11px}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:3px;color:#555}
.legend-item:last-child{margin-bottom:0}
.legend-dot{width:9px;height:9px;border-radius:50%}
.popup-title{font-size:13px;font-weight:600;color:#111;margin-bottom:3px}
.popup-sub{font-size:11px;color:#888;margin-bottom:5px}
.popup-link{display:block;font-size:11px;color:#1565c0;margin-top:5px;text-decoration:none}
.popup-link:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row1">
    <span class="map-title" id="map-title" onclick="titleClick()">Carreras Cataluña 2026</span>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" id="search-input" type="text" placeholder="Buscar localidad..."
        oninput="onSearchInput()" onfocus="onSearchFocus()" onblur="onSearchBlur()">
      <span class="search-clear" id="search-clear" onclick="clearSearch()">✕</span>
      <div class="search-dropdown" id="search-dropdown"></div>
    </div>
    <span class="map-stats" id="stats"></span>
  </div>
  <div class="slider-row">
    <span class="slider-label" id="slider-label">Busca por fecha</span>
    <div class="slider-wrap">
      <div class="slider-track"></div>
      <div class="slider-fill" id="slider-fill"></div>
      <input type="range" id="slider-min" min="1" max="366" value="1">
      <input type="range" id="slider-max" min="1" max="366" value="366">
    </div>
  </div>
</div>

<div id="map">
  <div class="edit-panel" id="edit-panel">
    <h4>✎ Editor de coordenadas</h4>
    <p><b>1.</b> Haz clic en un pin para seleccionarlo<br><b>2.</b> Haz clic en el mapa donde empieza la carrera<br><b>3.</b> Repite y pulsa "Ver cambios"</p>
    <div class="edit-coords" id="edit-coords">Selecciona un pin para empezar</div>
    <button class="btn-e btn-green" id="btn-export" onclick="exportCoords()">Ver cambios</button>
    <textarea class="export-area" id="export-area" readonly></textarea>
    <button class="btn-e btn-grey" onclick="closeEdit()">Cerrar editor</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4a7c59"></div>Confirmada</div>
    <div class="legend-item"><div class="legend-dot" style="background:#c47c3e"></div>Pendiente</div>
  </div>
</div>

// Coords modified by editor (in-memory per session)
const savedCoords = {};

function getRaceCoord(r) {
  if(savedCoords[r.name]) return savedCoords[r.name];
  if(CUSTOM_COORDS[r.name]) return CUSTOM_COORDS[r.name];
  if(BASE_COORDS[r.loc]) return BASE_COORDS[r.loc];
  return null;
}

// -- MAP -----------------------------------------------------------------------
const map = L.map('map').setView([41.7, 1.8], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19
}).addTo(map);
setTimeout(() => {
  document.querySelectorAll('.leaflet-tile-pane').forEach(el => {
    el.style.filter = 'grayscale(100%) brightness(1.05)';
  });
}, 400);

// -- STATE ---------------------------------------------------------------------
let editMode = false;
let selectedPin = null; // {name, marker}
let sliderMin = 1, sliderMax = 366;
let searchFilter = null;
let markersLayer = L.layerGroup().addTo(map);

// -- SECRET EDITOR: triple-click on title -------------------------------------
let titleClicks = 0, titleTimer = null;
function titleClick() {
  titleClicks++;
  clearTimeout(titleTimer);
  titleTimer = setTimeout(() => { titleClicks = 0; }, 600);
  if (titleClicks >= 3) {
    titleClicks = 0;
    editMode = !editMode;
    selectedPin = null;
    document.getElementById('edit-panel').classList.toggle('visible', editMode);
    renderMarkers();
  }
}

// -- MAP CLICK: move selected pin ---------------------------------------------
map.on('click', function(e) {
  if (!editMode || !selectedPin) return;
  const { name, marker } = selectedPin;
  const latlng = e.latlng;
  marker.setLatLng(latlng);
  savedCoords[name] = [+latlng.lat.toFixed(5), +latlng.lng.toFixed(5)];
  // Update panel
  const n = Object.keys(savedCoords).length;
  document.getElementById('edit-coords').textContent =
    `OK Movida: ${name}\n[${savedCoords[name][0]}, ${savedCoords[name][1]}]`;
  document.getElementById('btn-export').textContent =
    `Ver cambios (${n} pin${n > 1 ? 'es' : ''})`;
  // Flash
  const el = marker.getElement();
  if (el) { el.style.opacity = '0.3'; setTimeout(() => { el.style.opacity = '1'; el.style.outline = 'none'; }, 400); }
  selectedPin = null;
});

// -- SLIDER --------------------------------------------------------------------
const MONTH_LABELS = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function doyToLabel(doy) {
  if (doy >= 366) return '31 Dic';
  if (doy <= 1) return '1 Ene';
  const md = [0,31,28,31,30,31,30,31,31,30,31,30,31];
  let m = 1, d = doy;
  while (m <= 12 && d > md[m]) { d -= md[m]; m++; }
  return m > 12 ? '31 Dic' : `${d} ${MONTH_LABELS[m]}`;
}

const sMin = document.getElementById('slider-min');
const sMax = document.getElementById('slider-max');
const sFill = document.getElementById('slider-fill');

function updateSlider() {
  const p1 = (sliderMin - 1) / 365 * 100;
  const p2 = (sliderMax - 1) / 365 * 100;
  sFill.style.left = p1 + '%';
  sFill.style.width = (p2 - p1) + '%';
  document.getElementById('slider-label').textContent =
    (sliderMin === 1 && sliderMax === 366) ? 'Busca por fecha' : doyToLabel(sliderMin) + ' -> ' + doyToLabel(sliderMax);
  renderMarkers();
}
sMin.addEventListener('input', () => { sliderMin = Math.min(+sMin.value, sliderMax - 1); sMin.value = sliderMin; updateSlider(); });
sMax.addEventListener('input', () => { sliderMax = Math.max(+sMax.value, sliderMin + 1); sMax.value = sliderMax; updateSlider(); });
updateSlider();

// -- SEARCH --------------------------------------------------------------------
const allLocs = [...new Set(RACES.map(r => r.loc))].sort();

function onSearchInput() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  document.getElementById('search-clear').style.display = q ? 'block' : 'none';
  if (!q) { searchFilter = null; hideDropdown(); renderMarkers(); return; }
  showDropdown(allLocs.filter(l => l.toLowerCase().includes(q)));
}
function onSearchFocus() {
  if (!document.getElementById('search-input').value.trim()) showDropdown(allLocs.slice(0, 12));
}
function onSearchBlur() { setTimeout(hideDropdown, 200); }
function showDropdown(locs) {
  const dd = document.getElementById('search-dropdown');
  if (!locs.length) { dd.innerHTML = '<div class="search-item" style="color:#aaa">Sin resultados</div>'; dd.classList.add('visible'); return; }
  dd.innerHTML = locs.slice(0, 15).map(l => {
    const n = RACES.filter(r => r.loc === l).length;
    return `<div class="search-item" onmousedown="selectLoc('${l.replace(/'/g,"\\'")}')"><span>${l}</span><span>${n} carrera${n > 1 ? 's' : ''}</span></div>`;
  }).join('');
  dd.classList.add('visible');
}
function hideDropdown() { document.getElementById('search-dropdown').classList.remove('visible'); }
function selectLoc(loc) {
  searchFilter = loc;
  document.getElementById('search-input').value = loc;
  document.getElementById('search-clear').style.display = 'block';
  hideDropdown();
  renderMarkers();
  const c = BASE_COORDS[loc];
  if (c) map.setView(c, 13);
}
function clearSearch() {
  searchFilter = null;
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  renderMarkers();
}

// -- ICONS ---------------------------------------------------------------------
function makeIcon(confirmed) {
  const bg = confirmed ? '#4a7c59' : '#c47c3e';
  return L.divIcon({
    html: `<div style="width:18px;height:18px;background:${bg};border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.25)"></div>`,
    iconSize: [18, 18], iconAnchor: [9, 9], className: ''
  });
}

// -- RENDER --------------------------------------------------------------------
function renderMarkers() {
  markersLayer.clearLayers();
  const fr = RACES.filter(r => {
    return r.doy >= sliderMin && r.doy <= sliderMax && (!searchFilter || r.loc === searchFilter);
  });

  const jitter = () => (Math.random() - 0.5) * 0.005;

  fr.forEach(r => {
    const base = getRaceCoord(r);
    if (!base) return;
    // Use saved exact coord or jittered base
    const hasCustom = !!savedCoords[r.name];
    const lat = hasCustom ? base[0] : base[0] + jitter();
    const lng = hasCustom ? base[1] : base[1] + jitter();
    const marker = L.marker([lat, lng], { icon: makeIcon(r.confirmed), draggable: false });

    if (editMode) {
      // In edit mode: click selects pin, no popup
      marker.on('click', function() {
        // Deselect previous
        if (selectedPin) {
          const prev = selectedPin.marker.getElement();
          if (prev) prev.style.outline = 'none';
        }
        selectedPin = { name: r.name, marker };
        const el = marker.getElement();
        if (el) el.style.outline = '3px solid #111';
        document.getElementById('edit-coords').textContent =
          `>> ${r.name}\n${r.loc} · ${r.date}\n\nHaz clic en el mapa para moverlo`;
      });
    } else {
      // Normal mode: popup
      marker.bindPopup(`<div style="min-width:180px">
        <div class="popup-title">${r.name}</div>
        <div class="popup-sub">${r.loc} · ${r.date} · ${r.month}<br>${r.dist}</div>
        ${r.web ? `<a class="popup-link" href="${r.web}" target="_blank" rel="noopener">-> Web oficial</a>` : ''}
      </div>`, { maxWidth: 260 });
    }
    markersLayer.addLayer(marker);
  });

  document.getElementById('stats').innerHTML = `<strong>${fr.length}</strong> carreras`;
}

// -- EDITOR ACTIONS ------------------------------------------------------------
function exportCoords() {
  if (!Object.keys(savedCoords).length) {
    alert('No hay cambios todavía.\n\n1. Haz clic en un pin (se marca con borde negro)\n2. Haz clic en el mapa para moverlo');
    return;
  }
  let text = 'COORDENADAS MODIFICADAS:\n(Pega esto en el chat con Claude)\n\n';
  Object.entries(savedCoords).forEach(([name, c]) => { text += `"${name}": [${c[0]}, ${c[1]}]\n`; });
  const area = document.getElementById('export-area');
  area.style.display = 'block';
  area.value = text;
  area.focus();
  area.select();
}

function closeEdit() {
  editMode = false;
  selectedPin = null;
  document.getElementById('edit-panel').classList.remove('visible');
  renderMarkers();
}

renderMarkers();
