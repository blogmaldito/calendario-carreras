<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid #e0e0e0;padding:10px 14px;flex-shrink:0}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.maptitle{font-size:15px;font-weight:600;color:#111}
.searchwrap{position:relative;flex:1;max-width:220px}
.searchinput{width:100%;font-size:12px;padding:5px 10px 5px 28px;border:1px solid #ddd;border-radius:20px;outline:none;color:#333}
.searchinput:focus{border-color:#888}
.searchicon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#aaa;font-size:13px;pointer-events:none}
.searchdrop{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:2000;max-height:200px;overflow-y:auto;display:none}
.searchdrop.vis{display:block}
.searchitem{padding:7px 12px;font-size:12px;cursor:pointer;color:#333}
.searchitem:hover{background:#f5f5f5}
.mapstats{font-size:11px;color:#aaa;margin-left:auto}
.mapstats strong{color:#555}
.filterrow{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:16px;border:1px solid #ddd;background:#fff;color:#666;cursor:pointer;transition:all .15s}
.fbtn.active{background:#111;color:#fff;border-color:#111}
.fbtn:hover:not(.active){background:#f5f5f5}
#map{flex:1;position:relative}
.legend{position:absolute;bottom:24px;left:10px;z-index:1000;background:rgba(255,255,255,.95);padding:8px 12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:11px}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:3px;color:#555}
.legend-item:last-child{margin-bottom:0}
.legend-dot{width:9px;height:9px;border-radius:50%}
.popup-title{font-size:13px;font-weight:600;color:#111;margin-bottom:3px}
.popup-sub{font-size:11px;color:#888;margin-bottom:4px}
.popup-link{display:block;font-size:11px;color:#1565c0;margin-top:4px;text-decoration:none}
.popup-guide{display:inline-block;font-size:11px;font-weight:600;color:#2e7d32;background:#e8f5e9;padding:2px 8px;border-radius:8px;margin-top:6px;text-decoration:none}
</style>

var MONTH_ORDER = ["Octubre 2026","Noviembre 2026","Diciembre 2026","Enero 2027","Febrero 2027","Marzo 2027","Abril 2027","Mayo 2027"];
var activeFilter = "Todos";

var map = L.map('map').setView([41.7, 1.8], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap', maxZoom: 19
}).addTo(map);
setTimeout(function() {
  document.querySelectorAll('.leaflet-tile-pane').forEach(function(el) {
    el.style.filter = 'grayscale(100%) brightness(1.05)';
  });
}, 400);

var markersLayer = L.layerGroup().addTo(map);

function makeIcon(confirmed) {
  var bg = confirmed ? '#4a7c59' : '#c47c3e';
  return L.divIcon({
    html: '<div style="width:20px;height:20px;background:' + bg + ';border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>',
    iconSize: [20, 20], iconAnchor: [10, 10], className: ''
  });
}

function renderMarkers() {
  markersLayer.clearLayers();
  var fr = RACES.filter(function(r) {
    if (activeFilter === "Todos") return true;
    if (activeFilter === "2026") return r.year === "2026";
    if (activeFilter === "2027") return r.year === "2027";
    return r.month_year === activeFilter;
  });
  var jitter = function() { return (Math.random() - 0.5) * 0.003; };
  fr.forEach(function(r) {
    var marker = L.marker([r.lat + jitter(), r.lng + jitter()], { icon: makeIcon(r.confirmed) });
    var popup = '<div style="min-width:200px;max-width:260px">';
    popup += '<div class="popup-title">' + r.name + '</div>';
    popup += '<div class="popup-sub">' + r.loc + ' &middot; ' + r.date + ' &middot; ' + r.month_year + '</div>';
    popup += '<div style="font-size:11px;color:#777;margin-bottom:4px">' + r.dist + '</div>';
    if (r.web) popup += '<a class="popup-link" href="' + r.web + '" target="_blank" rel="noopener">Web oficial</a>';
    if (r.guideUrl) popup += '<a class="popup-guide" href="' + r.guideUrl + '" target="_blank" rel="noopener">Guia del recorregut</a>';
    popup += '</div>';
    marker.bindPopup(popup, { maxWidth: 280 });
    markersLayer.addLayer(marker);
  });
  document.getElementById('stats').innerHTML = '<strong>' + fr.length + '</strong> mitges';
}

function buildFilters() {
  var el = document.getElementById('filters');
  el.innerHTML = '';

  function addBtn(label, value) {
    var btn = document.createElement('button');
    btn.className = 'fbtn' + (value === activeFilter ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', function() {
      activeFilter = value;
      document.querySelectorAll('.fbtn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderMarkers();
    });
    el.appendChild(btn);
  }

  addBtn('Todos', 'Todos');

  var SHORT = {'Octubre':'Oct','Noviembre':'Nov','Diciembre':'Dic','Enero':'Ene','Febrero':'Feb','Marzo':'Mar','Abril':'Abr','Mayo':'May'};
  MONTH_ORDER.forEach(function(my) {
    if (RACES.some(function(r) { return r.month_year === my; })) {
      var parts = my.split(' ');
      var label = (SHORT[parts[0]] || parts[0]) + ' ' + parts[1];
      addBtn(label, my);
    }
  });
}

// Search
var elInput = document.getElementById('sinput');
var elDrop = document.getElementById('sdrop');

elInput.addEventListener('input', function() {
  var q = elInput.value.toLowerCase().trim();
  if (!q) { elDrop.classList.remove('vis'); return; }
  var matches = RACES.filter(function(r) { return r.name.toLowerCase().indexOf(q) >= 0 || r.loc.toLowerCase().indexOf(q) >= 0; });
  showDrop(matches);
});
elInput.addEventListener('focus', function() {
  if (!elInput.value.trim()) showDrop(RACES.slice(0, 12));
});
elInput.addEventListener('blur', function() { setTimeout(function() { elDrop.classList.remove('vis'); }, 200); });

function showDrop(items) {
  elDrop.innerHTML = '';
  items.slice(0, 15).forEach(function(r) {
    var div = document.createElement('div');
    div.className = 'searchitem';
    div.textContent = r.name + ' \u00b7 ' + r.loc;
    div.addEventListener('mousedown', function() {
      elInput.value = r.name;
      elDrop.classList.remove('vis');
      markersLayer.clearLayers();
      var marker = L.marker([r.lat, r.lng], { icon: makeIcon(r.confirmed) });
      marker.addTo(markersLayer);
      map.setView([r.lat, r.lng], 13);
      marker.openPopup();
    });
    elDrop.appendChild(div);
  });
  if (!items.length) elDrop.innerHTML = '<div class="searchitem" style="color:#aaa">Sense resultats</div>';
  elDrop.classList.add('vis');
}

buildFilters();
renderMarkers();
</script>
</body>
</html>
