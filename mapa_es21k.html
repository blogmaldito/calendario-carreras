<html lang="es">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid #e0e0e0;padding:8px 14px;flex-shrink:0}
.row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.maptitle{font-size:14px;font-weight:600;color:#111;white-space:nowrap}
.search-wrap{position:relative;min-width:140px;flex:1;max-width:180px}
.sinput{width:100%;font-size:11px;padding:4px 8px 4px 24px;border:1px solid #ddd;border-radius:16px;outline:none;color:#333}
.sinput:focus{border-color:#888}
.sicon{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:#bbb;font-size:11px;pointer-events:none}
.sdrop{position:fixed;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:9999;max-height:400px;overflow-y:auto;display:none;min-width:180px;-webkit-overflow-scrolling:touch}
.sdrop.vis{display:block}
.sitem{padding:6px 10px;font-size:11px;cursor:pointer;color:#333}
.sitem:hover{background:#f5f5f5}
.mapstats{font-size:11px;color:#aaa;margin-left:auto}
.mapstats strong{color:#555}
.row2{display:flex;flex-wrap:wrap;gap:5px}
.fbtn{font-size:10px;font-weight:500;padding:3px 9px;border-radius:12px;border:1px solid #e0e0e0;background:#fff;color:#666;cursor:pointer;transition:all .12s;white-space:nowrap}
.fbtn:hover:not(.active){background:#f5f5f5}
.fbtn.active{background:#111;color:#fff;border-color:#111}
#map{flex:1;position:relative}
.legend{position:absolute;bottom:24px;left:10px;z-index:1000;background:rgba(255,255,255,.95);padding:8px 12px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:11px}
.legend-item{display:flex;align-items:center;gap:6px;margin-bottom:3px;color:#555}
.legend-item:last-child{margin-bottom:0}
.legend-dot{width:8px;height:8px;border-radius:50%}
.popup-title{font-size:12px;font-weight:600;color:#111;margin-bottom:2px}
.popup-sub{font-size:10px;color:#888;margin-bottom:3px}
.popup-link{display:block;font-size:10px;color:#1565c0;margin-top:4px;text-decoration:none}
.edit-panel{position:absolute;top:10px;right:10px;z-index:1000;background:#fff;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:14px;width:250px;display:none;font-size:12px}
.edit-panel.visible{display:block}
.edit-panel h4{font-size:13px;font-weight:600;color:#111;margin-bottom:6px}
.edit-panel p{color:#777;margin-bottom:8px;line-height:1.5;font-size:11px}
.edit-coords{background:#f5f5f5;border-radius:6px;padding:8px;font-family:monospace;font-size:10px;color:#333;margin-bottom:8px;word-break:break-all;min-height:40px;white-space:pre-wrap}
.btn-e{width:100%;padding:6px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;margin-top:4px}
.btn-dark{background:#222;color:#fff}
.btn-green{background:#2e5e3e;color:#fff}
.btn-grey{background:#eee;color:#666}
</style>
</head>
<body>
<div class="topbar">
  <div class="row1">
    <span class="maptitle" id="maptitle" onclick="titleClick()" style="cursor:default">Medias Maratones España 2026-27</span>
    <div class="search-wrap" id="sw-loc">
      <span class="sicon">&#128269;</span>
      <input class="sinput" id="si-loc" type="text" placeholder="Municipio...">
      <div class="sdrop" id="sd-loc"></div>
    </div>
    <div class="search-wrap" id="sw-prov">
      <span class="sicon">&#128269;</span>

    <div class="search-wrap" id="sw-com">
      <span class="sicon">&#128269;</span>
      <input class="sinput" id="si-com" type="text" placeholder="Comunidad...">
      <div class="sdrop" id="sd-com"></div>
    </div>
    <span class="mapstats" id="stats"></span>
  </div>
  <div class="row2" id="month-filters"></div>
</div>
<div id="map">
  <div class="edit-panel" id="edit-panel">
    <h4>&#9998; Editor de coordenadas</h4>
    <p><b>1.</b> Haz clic en un pin para seleccionarlo<br><b>2.</b> Haz clic en el mapa para moverlo<br><b>3.</b> Pulsa "Ver cambios" al acabar</p>
    <div class="edit-coords" id="edit-coords">Selecciona un pin para empezar</div>
    <button class="btn-e btn-green" id="btn-export" onclick="exportCoords()">Ver cambios</button>
    <textarea id="export-area" style="display:none;width:100%;margin-top:6px;font-size:10px;font-family:monospace;padding:6px;border:1px solid #ddd;border-radius:6px;height:100px;resize:vertical" readonly></textarea>
    <button class="btn-e btn-grey" onclick="closeEdit()">Cerrar editor</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#4a7c59"></div>Confirmada</div>
    <div class="legend-item"><div class="legend-dot" style="background:#c47c3e"></div>Pendiente</div>
  </div>
</div>

var MONTH_ORDER = ['Septiembre 2026','Octubre 2026','Noviembre 2026','Diciembre 2026',
  'Enero 2027','Febrero 2027','Marzo 2027','Abril 2027','Mayo 2027',
  'Junio 2027','Julio 2027','Agosto 2027','Septiembre 2027','Octubre 2027','Noviembre 2027'];
var SHORT = {'Septiembre':'Sep','Octubre':'Oct','Noviembre':'Nov','Diciembre':'Dic',
  'Enero':'Ene','Febrero':'Feb','Marzo':'Mar','Abril':'Abr','Mayo':'May',
  'Junio':'Jun','Julio':'Jul','Agosto':'Ago'};

var map = L.map('map').setView([40.0, -3.5], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap', maxZoom: 18
}).addTo(map);
setTimeout(function() {
  document.querySelectorAll('.leaflet-tile-pane').forEach(function(el) {
    el.style.filter = 'grayscale(100%) brightness(1.05)';
  });
}, 400);

var markersLayer = L.layerGroup().addTo(map);
var filters = {month: 'Todos', loc: '', prov: '', com: ''};

function getFiltered() {
  return RACES.filter(function(r) {
    if (!r.lat) return false;
    if (filters.month !== 'Todos' && r.month_year !== filters.month) return false;
    if (filters.loc && r.loc.toLowerCase().indexOf(filters.loc) < 0) return false;
    if (filters.prov && r.prov.toLowerCase().indexOf(filters.prov) < 0) return false;
    if (filters.com && r.com.toLowerCase().indexOf(filters.com) < 0) return false;
    return true;
  });
}

function makeIcon(confirmed) {
  var bg = confirmed ? '#4a7c59' : '#c47c3e';
  return L.divIcon({
    html: '<div style="width:16px;height:16px;background:' + bg + ';border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.25)"></div>',
    iconSize: [16,16], iconAnchor: [8,8], className: ''
  });
}

function renderMarkers() {
  markersLayer.clearLayers();
  var fr = getFiltered();
  var jitter = function() { return (Math.random()-0.5)*0.01; };
  fr.forEach(function(r) {
    var marker = L.marker([r.lat+jitter(), r.lng+jitter()], {icon: makeIcon(r.confirmed)});
    var p = '<div style="min-width:190px;max-width:250px">';
    p += '<div class="popup-title">' + r.name + '</div>';
    p += '<div class="popup-sub">' + r.loc + ' &middot; ' + r.prov + ' &middot; ' + r.com + '</div>';
    p += '<div class="popup-sub">' + r.date + ' &middot; ' + r.dist + '</div>';
    if (r.web) p += '<a class="popup-link" href="' + r.web + '" target="_blank" rel="noopener">Web oficial</a>';
    p += '</div>';
    marker.bindPopup(p, {maxWidth: 260});
    markersLayer.addLayer(marker);
  });
  document.getElementById('stats').innerHTML = '<strong>' + fr.length + '</strong> carreras';
}

function buildMonthFilters() {
  var el = document.getElementById('month-filters');
  var months = ['Todos'].concat(MONTH_ORDER.filter(function(m) {
    return RACES.some(function(r) { return r.month_year === m; });
  }));
  months.forEach(function(m) {
    var btn = document.createElement('button');
    btn.className = 'fbtn' + (m === 'Todos' ? ' active' : '');
    if (m === 'Todos') { btn.textContent = 'Todos'; }
    else { var p = m.split(' '); btn.textContent = (SHORT[p[0]]||p[0]) + ' ' + p[1]; }
    btn.addEventListener('click', function() {
      filters.month = m;
      document.querySelectorAll('#month-filters .fbtn').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      renderMarkers();
    });
    el.appendChild(btn);
  });
}

function setupSearch(inpId, dropId, key) {
  var inp = document.getElementById(inpId);
  var drop = document.getElementById(dropId);
  var allVals = [...new Set(RACES.map(function(r){return r[key];}).filter(Boolean))].sort(function(a,b){
    return a.localeCompare(b, 'es', {sensitivity:'base'});
  });

  inp.addEventListener('input', function() {
    var q = inp.value.toLowerCase().trim();
    filters[key] = q;
    if (!q) { drop.classList.remove('vis'); renderMarkers(); return; }
    var matches = allVals.filter(function(v){return v.toLowerCase().indexOf(q)>=0;});
    showDrop(drop, matches, function(v) {
      inp.value = v; filters[key] = v.toLowerCase();
      drop.classList.remove('vis'); renderMarkers();
      // Fit map to show all matching races
      var matching = RACES.filter(function(r){ return r[key]===v && r.lat; });
      if (matching.length === 1) {
        map.setView([matching[0].lat, matching[0].lng], 9);
      } else if (matching.length > 1) {
        var lats = matching.map(function(r){return r.lat;});
        var lngs = matching.map(function(r){return r.lng;});
        var bounds = [[Math.min.apply(null,lats), Math.min.apply(null,lngs)],
                      [Math.max.apply(null,lats), Math.max.apply(null,lngs)]];
        map.fitBounds(bounds, {padding: [60,60], maxZoom: 10});
      }
    }, inp);
    // Also fit bounds when typing directly
    var q2 = inp.value.toLowerCase().trim();
    if (q2) {
      var matching2 = RACES.filter(function(r){ return r[key] && r[key].toLowerCase().indexOf(q2)>=0 && r.lat; });
      if (matching2.length > 0) {
        var lats2 = matching2.map(function(r){return r.lat;});
        var lngs2 = matching2.map(function(r){return r.lng;});
        map.fitBounds([[Math.min.apply(null,lats2),Math.min.apply(null,lngs2)],
                       [Math.max.apply(null,lats2),Math.max.apply(null,lngs2)]], {padding:[30,30]});
      }
    }
  });
  inp.addEventListener('focus', function() {
    if (!inp.value.trim()) showDrop(drop, allVals, function(v) {
      inp.value = v; filters[key] = v.toLowerCase();
      drop.classList.remove('vis'); renderMarkers();
    }, inp);
  });
  inp.addEventListener('blur', function(){setTimeout(function(){drop.classList.remove('vis');},200);});
}

function showDrop(drop, items, onSelect, inp) {
  drop.innerHTML = '';
  items.forEach(function(v) {
    var d = document.createElement('div'); d.className = 'sitem'; d.textContent = v;
    d.addEventListener('mousedown', function(){onSelect(v);});
    drop.appendChild(d);
  });
  if (!items.length) drop.innerHTML = '<div class="sitem" style="color:#bbb">Sin resultados</div>';
  // Position using fixed coords
  var rect = inp.getBoundingClientRect();
  drop.style.left = rect.left + 'px';
  drop.style.top = (rect.bottom + 4) + 'px';
  drop.style.width = rect.width + 'px';
  drop.classList.add('vis');
}

setupSearch('si-loc','sd-loc','loc');
setupSearch('si-prov','sd-prov','prov');
setupSearch('si-com','sd-com','com');
buildMonthFilters();
renderMarkers();

// ── EDITOR ────────────────────────────────────────────────────────────────────
var savedCoords = {};
var editMode = false;
var selectedPin = null;

var titleClicks = 0, titleTimer = null;
function titleClick() {
  titleClicks++;
  clearTimeout(titleTimer);
  titleTimer = setTimeout(function(){ titleClicks = 0; }, 600);
  if (titleClicks >= 3) {
    titleClicks = 0;
    editMode = !editMode;
    selectedPin = null;
    document.getElementById('edit-panel').classList.toggle('visible', editMode);
    renderMarkers();
  }
}

map.on('click', function(e) {
  if (!editMode || !selectedPin) return;
  var name = selectedPin.name;
  var marker = selectedPin.marker;
  var latlng = e.latlng;
  marker.setLatLng(latlng);
  savedCoords[name] = [+latlng.lat.toFixed(5), +latlng.lng.toFixed(5)];
  document.getElementById('edit-coords').textContent = '✓ ' + name + '\n[' + savedCoords[name][0] + ', ' + savedCoords[name][1] + ']';
  var n = Object.keys(savedCoords).length;
  document.getElementById('btn-export').textContent = 'Ver cambios (' + n + ' pin' + (n>1?'es':'') + ')';
  var el = marker.getElement();
  if (el) { el.style.opacity='0.3'; setTimeout(function(){el.style.opacity='1';el.style.outline='none';},400); }
  selectedPin = null;
});

function exportCoords() {
  if (!Object.keys(savedCoords).length) {
    alert('No hay cambios todavia.\n\n1. Haz clic en un pin (se marca)\n2. Haz clic en el mapa para moverlo');
    return;
  }
  var text = 'COORDENADAS MODIFICADAS ES21K:\n(Pega esto en el chat con Claude)\n\n';
  Object.entries(savedCoords).forEach(function(e){ text += '"' + e[0] + '": [' + e[1][0] + ', ' + e[1][1] + ']\n'; });
  var area = document.getElementById('export-area');
  area.style.display = 'block';
  area.value = text;
  area.focus();
  area.select();
}

function closeEdit() {
  editMode = false;
  selectedPin = null;
  document.getElementById('edit-panel').classList.remove('visible');
  renderMarkers();
}

var origRenderMarkers = renderMarkers;
renderMarkers = function() {
  markersLayer.clearLayers();
  var fr = getFiltered();
  var jitter = function() { return (Math.random()-0.5)*0.01; };
  fr.forEach(function(r) {
    var lat = (savedCoords[r.name] ? savedCoords[r.name][0] : r.lat);
    var lng = (savedCoords[r.name] ? savedCoords[r.name][1] : r.lng);
    if (!lat) return;
    var usedLat = savedCoords[r.name] ? lat : lat+jitter();
    var usedLng = savedCoords[r.name] ? lng : lng+jitter();
    var marker = L.marker([usedLat, usedLng], {icon: makeIcon(r.confirmed)});
    if (editMode) {
      marker.on('click', function() {
        if (selectedPin) {
          var prev = selectedPin.marker.getElement();
          if (prev) prev.style.outline = 'none';
        }
        selectedPin = {name: r.name, marker: marker};
        var el = marker.getElement();
        if (el) el.style.outline = '3px solid #111';
        document.getElementById('edit-coords').textContent = '&#128205; ' + r.name + '\n' + r.loc + ' · ' + r.prov + '\n\nHaz clic en el mapa para moverlo';
      });
    } else {
      var p = '<div style="min-width:190px;max-width:250px">';
      p += '<div class="popup-title">' + r.name + '</div>';
      p += '<div class="popup-sub">' + r.loc + ' &middot; ' + r.prov + ' &middot; ' + r.com + '</div>';
      p += '<div class="popup-sub">' + r.date + ' &middot; ' + r.dist + '</div>';
      if (r.web) p += '<a class="popup-link" href="' + r.web + '" target="_blank" rel="noopener">Web oficial</a>';
      p += '</div>';
      marker.bindPopup(p, {maxWidth: 260});
    }
    markersLayer.addLayer(marker);
  });
  document.getElementById('stats').innerHTML = '<strong>' + fr.length + '</strong> carreras';
};
renderMarkers();
</script>
</body>
