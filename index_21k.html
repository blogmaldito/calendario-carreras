<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendari Mitges Maratons Catalunya 2026-27</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#333;padding:20px;max-width:900px;margin:0 auto}
.cal-header{padding:1.5rem 0 1rem}
.cal-title{font-size:22px;font-weight:600;color:#111;margin-bottom:4px}
.cal-sub{font-size:14px;color:#777;line-height:1.6}
.stats-bar{display:flex;gap:16px;margin-bottom:1.25rem;flex-wrap:wrap}
.stat{font-size:13px;color:#666}
.stat strong{color:#111;font-weight:600}
.filter-group{margin-bottom:10px}
.filter-label{font-size:11px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.75rem}
.filter-btn{font-size:12px;font-weight:500;padding:5px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#666;cursor:pointer;transition:all .15s}
.filter-btn.active{background:#111;color:#fff;border-color:#111}
.month-block{margin-bottom:2rem}
.month-label{font-size:12px;font-weight:700;color:#999;text-transform:uppercase;letter-spacing:.08em;padding:8px 0;border-bottom:1px solid #eee;margin-bottom:.75rem}
.race-item{border:1px solid #eee;border-radius:8px;margin-bottom:6px;overflow:hidden}
.race-header{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none}
.race-header:hover{background:#fafafa}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px;align-self:flex-start}
.dot-ok{background:#2e7d32}
.dot-pend{background:#e65100}
.race-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.race-name{font-size:14px;font-weight:500;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.race-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.race-date{font-size:11px;color:#888}
.race-dist{font-size:11px;padding:1px 7px;border-radius:10px;background:#f0f0f0;color:#555}
.race-loc{font-size:11px;color:#aaa;overflow:hidden;text-overflow:ellipsis;max-width:150px;white-space:nowrap}
.chevron{width:14px;height:14px;color:#bbb;transition:transform .2s;flex-shrink:0;align-self:flex-start;margin-top:3px}
.chevron.open{transform:rotate(180deg)}
.race-body{padding:0 14px 12px 32px;display:none;grid-template-columns:1fr 1fr;gap:5px}
.race-body.open{display:grid}
.detail{font-size:12px;color:#666}
.detail span{color:#aaa;margin-right:4px}
.links{grid-column:1/-1;display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.link-web{font-size:12px;font-weight:500;color:#1565c0;text-decoration:none;border-bottom:1px solid #bbdefb}
.link-guide{font-size:11px;font-weight:600;color:#2e7d32;background:#e8f5e9;padding:3px 10px;border-radius:10px;text-decoration:none}
.legend{display:flex;gap:16px;margin-bottom:1rem}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#666}
.legend-dot{width:8px;height:8px;border-radius:50%}
</style>
</head>
<body>
<div class="cal-header">

</div>
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:#2e7d32"></div>Confirmada</div>
  <div class="legend-item"><div class="legend-dot" style="background:#e65100"></div>Pendiente</div>
</div>
<div class="filter-group">
  <div class="filter-label">Mes</div>
  <div class="filters" id="filters"></div>
</div>
<div id="list"></div>

-qqL"}, {"name": "MITJA PLA DE L'ESTANY", "loc": "Banyoles", "dist": "21k · 6k", "date": "04/04", "month": "Abril 2027", "doy": 94, "confirmed": true, "web": "https://cnbanyoles.cat/competicions/mitja-marato-del-pla-de-lestany/", "guideUrl": "https://wp.me/pNuBu-nQL"}, {"name": "MITJA MIAMI PLATJA", "loc": "Montroig del Camp", "dist": "21k · 10k · 5k", "date": "04/04", "month": "Abril 2027", "doy": 94, "confirmed": false, "web": "https://webtretzesports.wixsite.com/mitjamiamiplatja", "guideUrl": ""}, {"name": "MITJA DE MONTORNÈS", "loc": "Montornès", "dist": "21k · 6k", "date": "11/04", "month": "Abril 2027", "doy": 101, "confirmed": false, "web": "https://mitjamontornes.com/", "guideUrl": "https://wp.me/pNuBu-nPO"}, {"name": "MITJA D'EMPÚRIES", "loc": "L'Escala", "dist": "21k · 42k · 10k ·5k", "date": "18/04", "month": "Abril 2027", "doy": 108, "confirmed": false, "web": "https://esportslescala.cat/marato-dempuries/", "guideUrl": ""}, {"name": "MITJA DEL MEDITERRANI", "loc": "Castelldefels", "dist": "21k · 10k · 5k", "date": "25/04", "month": "Abril 2027", "doy": 115, "confirmed": true, "web": "https://www.zonavipevents.com/marato-del-mediterrani/", "guideUrl": "https://wp.me/pNuBu-qN3"}, {"name": "MITJA MARATÓ VIES VERDES", "loc": "Girona / Platja D'Aro", "dist": "42k · 30k · 21k · 10k", "date": "25/04", "month": "Abril 2027", "doy": 115, "confirmed": false, "web": "https://maratonviasverdes.com/ca/girona", "guideUrl": ""}, {"name": "MITJA DE TÀRREGA", "loc": "Tàrrega", "dist": "21k · 10k", "date": "09/05", "month": "Mayo 2027", "doy": 129, "confirmed": false, "web": "https://fondistestarrega.com/ca/pc/2-mitja-marato-i-10-km-ciutat-de-tarrega", "guideUrl": "https://wp.me/pNuBu-o1H"}, {"name": "21K LO CARO", "loc": "Tortosa", "dist": "21k ·10k", "date": "16/05", "month": "Mayo 2027", "doy": 136, "confirmed": false, "web": "http://www.21kloport.cat/es/inicio/", "guideUrl": ""}, {"name": "RUN FESTIVAL TOSSA DE MAR", "loc": "Tossa de Mar", "dist": "21k · 42k · 10k ·5k", "date": "16/05", "month": "Mayo 2027", "doy": 136, "confirmed": true, "web": "https://runfestivaltossa.com/", "guideUrl": "https://wp.me/pNuBu-l6k"}, {"name": "MITJA RURAL DE REUS", "loc": "Reus", "dist": "21k · 10k", "date": "30/05", "month": "Mayo 2027", "doy": 150, "confirmed": false, "web": "https://webtretzesports.wixsite.com/mitjaruralreus", "guideUrl": ""}];

var MONTH_ORDER = ["Octubre 2026","Noviembre 2026","Diciembre 2026","Enero 2027","Febrero 2027","Marzo 2027","Abril 2027","Mayo 2027"];
var activeMonth = "Todos";

function render() {
  var filtered = activeMonth === "Todos" ? RACES : RACES.filter(function(r){ return r.month === activeMonth; });
  document.getElementById("s-total").innerHTML = "<strong>" + filtered.length + "</strong> carreras";
  document.getElementById("s-conf").innerHTML = "<strong style='color:#2e7d32'>" + filtered.filter(function(r){return r.confirmed;}).length + "</strong> confirmades";
  document.getElementById("s-guide").innerHTML = "<strong style='color:#1565c0'>" + filtered.filter(function(r){return r.guideUrl;}).length + "</strong> amb guia";

  var byMonth = {};
  filtered.forEach(function(r){
    if (!byMonth[r.month]) byMonth[r.month] = [];
    byMonth[r.month].push(r);
  });

  var listEl = document.getElementById("list");
  listEl.innerHTML = "";

  MONTH_ORDER.forEach(function(m) {
    if (!byMonth[m]) return;
    var rs = byMonth[m];
    var block = document.createElement("div");
    block.className = "month-block";

    var label = document.createElement("div");
    label.className = "month-label";
    label.textContent = m + " · " + rs.length + " carrera" + (rs.length !== 1 ? "s" : "");
    block.appendChild(label);

    rs.forEach(function(r, i) {
      var item = document.createElement("div");
      item.className = "race-item";

      var header = document.createElement("div");
      header.className = "race-header";

      var dot = document.createElement("div");
      dot.className = "dot " + (r.confirmed ? "dot-ok" : "dot-pend");
      header.appendChild(dot);

      var content = document.createElement("div");
      content.className = "race-content";

      var name = document.createElement("div");
      name.className = "race-name";
      name.textContent = r.name;
      content.appendChild(name);

      var meta = document.createElement("div");
      meta.className = "race-meta";
      var loc = document.createElement("span"); loc.className = "race-loc"; loc.textContent = r.loc;
      var date = document.createElement("span"); date.className = "race-date"; date.textContent = r.date;
      var dist = document.createElement("span"); dist.className = "race-dist"; dist.textContent = r.dist;
      meta.appendChild(loc); meta.appendChild(date); meta.appendChild(dist);
      content.appendChild(meta);
      header.appendChild(content);

      var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
      svg.setAttribute("class","chevron"); svg.setAttribute("viewBox","0 0 16 16");
      svg.setAttribute("fill","none"); svg.setAttribute("stroke","currentColor"); svg.setAttribute("stroke-width","1.5");
      var path = document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d","M4 6l4 4 4-4"); svg.appendChild(path);
      header.appendChild(svg);

      var body = document.createElement("div");
      body.className = "race-body";

      var d1 = document.createElement("div"); d1.className = "detail";
      d1.innerHTML = "<span>Estat</span>" + (r.confirmed ? "Confirmada" : "Pendent");
      var d2 = document.createElement("div"); d2.className = "detail";
      d2.innerHTML = "<span>Localitat</span>" + r.loc;
      body.appendChild(d1); body.appendChild(d2);

      var links = document.createElement("div"); links.className = "links";
      if (r.web) {
        var a1 = document.createElement("a");
        a1.className = "link-web"; a1.href = r.web; a1.target = "_blank"; a1.rel = "noopener";
        a1.textContent = "Web oficial"; links.appendChild(a1);
      }
      if (r.guideUrl) {
        var a2 = document.createElement("a");
        a2.className = "link-guide"; a2.href = r.guideUrl; a2.target = "_blank"; a2.rel = "noopener";
        a2.textContent = "Guia del recorregut"; links.appendChild(a2);
      }
      body.appendChild(links);

      header.addEventListener("click", function() {
        var open = body.style.display === "grid";
        body.style.display = open ? "none" : "grid";
        svg.classList.toggle("open", !open);
      });

      item.appendChild(header);
      item.appendChild(body);
      block.appendChild(item);
    });

    listEl.appendChild(block);
  });
}

function buildFilters() {
  var months = ["Todos"].concat(MONTH_ORDER.filter(function(m){ return RACES.some(function(r){ return r.month === m; }); }));
  var filtersEl = document.getElementById("filters");
  filtersEl.innerHTML = "";
  months.forEach(function(m) {
    var btn = document.createElement("button");
    btn.className = "filter-btn" + (m === activeMonth ? " active" : "");
    btn.textContent = m;
    btn.addEventListener("click", function() {
      activeMonth = m;
      document.querySelectorAll(".filter-btn").forEach(function(b){ b.classList.toggle("active", b.textContent === m); });
      render();
    });
    filtersEl.appendChild(btn);
  });
}

buildFilters();
render();
</script>
